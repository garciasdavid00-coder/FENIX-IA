<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fenix IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20c4-1 6-5 6-9s2-8 6-9M4 20c2-4 2-9 6-13"/></svg>
        <span>Fenix IA</span>
      </div>
      <button class="toggle-btn" onclick="toggleSidebar()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
      </button>
    </div>

    <div class="nav-item" onclick="nuevoChat()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Nuevo chat
    </div>
    <div class="nav-item" onclick="toggleBuscar()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      Buscar
    </div>
    <div class="nav-item" onclick="mostrarVistaProyectos()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg>
      Proyectos
    </div>
    <div class="nav-item" onclick="mostrarVistaBiblioteca()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
      Biblioteca
    </div>

    <div class="divider"></div>

    <input type="text" id="buscarInput" class="buscar-input" placeholder="Buscar en el historial..." style="display:none;" oninput="filtrarRecientes()">

    <div class="recent-label">Recientes</div>
    <div id="recentesList"></div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="toggle-btn-topbar" id="toggleTopbar" onclick="toggleSidebar()" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20c4-1 6-5 6-9s2-8 6-9M4 20c2-4 2-9 6-13"/></svg>
        </button>
      </div>
      <div class="topbar-center" style="position:relative;">
        <button class="model-select" id="modeloSelectBtn" onclick="toggleMenuModelo(event)">
          <span id="modeloTextoActual">Groq (Llama 3.3)</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
      </div>
      <div class="topbar-right" id="authArea">
        <button class="signup-btn" id="btnGoogleLogin" onclick="iniciarSesionConGoogle()">Continuar con Google</button>
      </div>
    </div>

    <!-- Vista inicial (saludo + input grande) -->
    <div class="center-content" id="vistaInicial">
      <h1 class="greeting">Vamos con todo, Usuario</h1>

      <div class="chat-box">
        <textarea class="chat-input" placeholder="Cuando quieras..." rows="1" id="chatInput"></textarea>
        <div class="chat-actions">
          <button class="plus-btn" onclick="alert('Aquí abrirías el selector de archivos para adjuntar.')">+</button>
          <div class="right-actions">
            <button class="mic-btn" onclick="usarMicrofono()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="20" height="20"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
            </button>
            <button class="send-btn" onclick="sendMessage()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="pills">
        <div class="pill" onclick="usarPill('Ayúdame a crear un documento sobre: ')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Documentos</div>
        <div class="pill" onclick="usarPill('Ayúdame a crear una hoja de cálculo para: ')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>Hojas</div>
        <div class="pill" onclick="usarPill('Ayúdame a crear una presentación sobre: ')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="14" rx="2"/><line x1="3" y1="20" x2="21" y2="20"/></svg>Presentaciones</div>
        <div class="pill" onclick="usarPill('Genera una imagen de: ')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>Imágenes</div>
        <div class="pill" onclick="usarPill('Ayúdame a escribir: ')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.85 2.83 0 114 4L7.5 20.5 2 22l1.5-5.5z"/></svg>Escritura</div>
        <div class="pill" onclick="usarPill('Hazme un resumen de: ')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>Resumen</div>
        <div class="pill" onclick="usarPill('Búscame información sobre: ')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 010 20 15.3 15.3 0 010-20z"/></svg>Sitios</div>
      </div>
    </div>

    <!-- Vista de conversación (oculta hasta el primer mensaje) -->
    <div class="chat-view" id="vistaChat" style="display:none;">
      <div class="messages" id="messages"></div>

      <div class="chat-box chat-box-bottom">
        <textarea class="chat-input" placeholder="Cuando quieras..." rows="1" id="chatInput2"></textarea>
        <div class="chat-actions">
          <button class="plus-btn" onclick="alert('Aquí abrirías el selector de archivos para adjuntar.')">+</button>
          <div class="right-actions">
            <button class="mic-btn" onclick="usarMicrofono()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="20" height="20"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
            </button>
            <button class="send-btn" onclick="sendMessage(true)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Vista de Proyectos -->
    <div class="panel-view" id="vistaProyectos" style="display:none;">
      <div class="panel-header">
        <h2>Proyectos</h2>
        <button class="btn-primario" onclick="crearProyecto()">+ Nuevo proyecto</button>
      </div>
      <div class="panel-grid" id="proyectosList"></div>
    </div>

    <!-- Vista de un Proyecto específico -->
    <div class="panel-view" id="vistaProyectoDetalle" style="display:none;">
      <div class="panel-header">
        <button class="btn-volver" onclick="mostrarVistaProyectos()">← Proyectos</button>
        <h2 id="proyectoDetalleNombre"></h2>
        <button class="btn-primario" onclick="nuevoChatEnProyecto()">+ Nuevo chat aquí</button>
      </div>
      <div class="panel-grid" id="proyectoDetalleChats"></div>
    </div>

    <!-- Vista de Biblioteca -->
    <div class="panel-view" id="vistaBiblioteca" style="display:none;">
      <div class="panel-header">
        <h2>Biblioteca</h2>
        <label class="btn-primario" style="cursor:pointer;">
          + Subir archivo
          <input type="file" id="inputArchivo" style="display:none;" multiple onchange="subirArchivo(event)">
        </label>
      </div>
      <div class="panel-grid" id="bibliotecaList"></div>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
